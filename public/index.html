<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Engranajes 3D</title>
  <link rel="stylesheet" href="style.css">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>⚙️ Generador Paramétrico de Engranajes</h1>
      <p>Vista previa 3D en vivo y exportación para Autodesk Fusion 360</p>
    </header>

    <main class="content">
      <form id="gearForm" class="card">
        <h2>Parámetros Geométricos</h2>

        <div class="form-group">
          <label for="module">Módulo (m):</label>
          <input type="number" id="module" name="module" value="2" step="0.5" min="0.5" required>
        </div>

        <div class="form-group">
          <label for="teeth">Número de Dientes (Z):</label>
          <input type="number" id="teeth" name="teeth" value="20" min="6" max="200" required>
        </div>

        <div class="form-group">
          <label for="width">Ancho de Cara (mm):</label>
          <input type="number" id="width" name="width" value="12" min="1" required>
        </div>

        <div class="form-group">
          <label for="bore">Diámetro del Eje (mm):</label>
          <input type="number" id="bore" name="bore" value="10" min="0" required>
        </div>

        <button type="submit" class="btn-primary">
          📥 Descargar Script Python (.py)
        </button>
      </form>

      <div class="card viewer-card">
        <h2>Vista Previa 3D (Usa el ratón para girar/zoom)</h2>
        <div id="canvas-container"></div>
        
        <div class="stat-grid">
          <div class="stat-box">
            <span class="label">Diámetro Primitivo:</span>
            <span id="calcPitch" class="value">40 mm</span>
          </div>
          <div class="stat-box">
            <span class="label">Diámetro Exterior:</span>
            <span id="calcOuter" class="value">44 mm</span>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
